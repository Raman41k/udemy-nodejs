services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ".env"
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/usr/src/app
    networks:
      - app-network
    command: "npm run dev"
    depends_on:
      - mongodb
  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - app-network
    ports:
      - "27017:27017"
    command: ["mongod", "--auth"]
networks:
  app-network:
    driver: bridge
